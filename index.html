
<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#176b45">
    <title>پیام‌رسان حلقات صالحین</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="responsive.css">
</head>
<body class="messenger-page">

<header class="messenger-header">
    <a href="index.html" class="messenger-brand">
        <span class="brand-icon">ح</span>
        <span>
            <strong>حلقات صالحین</strong>
            <small>پیام‌رسان پایگاه</small>
        </span>
    </a>
    <a href="profile.html" class="account-button">
        <span>👤</span>
        <span>پروفایل من</span>
    </a>
</header>

<main class="messenger-main">

    <nav class="messenger-tabs" aria-label="بخش‌های پیام‌رسان">
        <button class="messenger-tab active" type="button"
                data-tab="all" aria-selected="true">📋 همه</button>
        <button class="messenger-tab" type="button"
                data-tab="base" aria-selected="false">🏘️ پایگاه</button>
        <button class="messenger-tab" type="button"
                data-tab="personal" aria-selected="false">💬 شخصی</button>
    </nav>

    <!-- پنج گروه مستقل -->
    <section class="tab-panel" id="groups-panel">
        <div class="list-heading">
            <div>
                <h1>گروه‌های حلقات</h1>
                <p>گفت‌وگوی اختصاصی هر حلقه</p>
            </div>
            <span class="section-symbol">👥</span>
        </div>

        <div id="groupsList"></div>

        <div class="empty-hint" id="groupsHint" hidden>
            <span>🔐</span>
            <p></p>
        </div>
    </section>

    <!-- کانال مستقل پایگاه -->
    <section class="tab-panel" id="channels-panel">
        <div class="list-heading">
            <div>
                <h1>کانال پایگاه</h1>
                <p>اطلاعیه‌ها و برنامه‌های رسمی</p>
            </div>
            <span class="section-symbol">📢</span>
        </div>

        <div id="channelsList"></div>
    </section>

    <!-- پیام‌های خصوصی -->
    <section class="tab-panel" id="personal-panel">
        <div class="list-heading">
            <div>
                <h1>پیام‌های شخصی</h1>
                <p>گفت‌وگوهای خصوصی اعضا</p>
            </div>
            <span class="section-symbol">💬</span>
        </div>

        <div class="empty-hint">
            <span>✉️</span>
            <p>پیام‌های شخصی به‌زودی فعال می‌شود.</p>
        </div>
    </section>

</main>

<footer class="messenger-footer">
    پیام‌رسان اختصاصی حلقات صالحین
</footer>

<script src="https://cdn.jsdelivr.net/npm/appwrite@21.4.0"></script>
<script src="config.js"></script>
<script src="app.js"></script>

</body>
</html>
