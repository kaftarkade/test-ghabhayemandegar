<!-- وضعیت ورود: لینک حساب در منوی دسکتاپ و موبایل -->
<script>
(function () {

    function updateAccountLinks() {

        var links = document.querySelectorAll(".account-link");

        var logged = false;

        try {
            logged = !!localStorage.getItem("memoryUser") &&
                     localStorage.getItem("loggedIn") === "true";
        } catch (e) {}

        links.forEach(function (link) {
            link.textContent = logged ? "👤 پروفایل" : "👤 ورود / ثبت‌نام";
            link.setAttribute("href", logged ? "profile.html" : "login.html");
        });

    }

    updateAccountLinks();

    window.addEventListener("pageshow", updateAccountLinks);
    window.addEventListener("focus", updateAccountLinks);

})();
</script>
