<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>پنل مدیریت | حلقات صالحین</title>
    <link rel="stylesheet" href="admin.css">
</head>
<body>
    <main class="container">

        <section class="panel" id="adminLoginPanel">
            <h2>ورود مدیر</h2>

            <form id="adminLoginForm">
                <label for="adminEmail">ایمیل مدیر</label>
                <input id="adminEmail" type="email" autocomplete="username" required>

                <label for="adminPassword">رمز عبور</label>
                <input id="adminPassword" type="password" autocomplete="current-password" required>

                <button type="submit">ورود به پنل مدیریت</button>
                <p id="adminLoginMessage" role="status"></p>
            </form>
        </section>

        <header class="header">
            <h1>پنل مدیریت حلقات صالحین</h1>
            <p>مدیریت اعضا و حلقه‌ها</p>
            <p>
                <a href="index.html">💬 پیام‌رسان</a> ·
                <button id="adminLogout" type="button">خروج</button>
            </p>
        </header>

        <section class="panel">
            <h2>افزودن عضو</h2>

            <form id="memberForm">
                <label for="fullName">نام و نام خانوادگی</label>
                <input id="fullName" type="text" required>

                <label for="phone">شماره تلفن</label>
                <input id="phone" type="tel" inputmode="numeric" placeholder="09123456789" required>

                <label for="nationalId">کد ملی (رمز ورود عضو)</label>
                <input id="nationalId" type="text" inputmode="numeric" maxlength="10"
                       pattern="[0-9]{10}" autocomplete="off" placeholder="کد ملی ۱۰ رقمی" required>

                <label for="ring">حلقه</label>
                <select id="ring" required>
                    <option value="ring1">حلقه اول</option>
                    <option value="ring2">حلقه دوم</option>
                    <option value="ring3">حلقه سوم</option>
                    <option value="ring4">حلقه چهارم</option>
                    <option value="ring5">حلقه پنجم</option>
                </select>

                <label for="status">وضعیت عضویت</label>
                <select id="status">
                    <option value="active">فعال</option>
                    <option value="inactive">غیرفعال (امکان ورود ندارد)</option>
                </select>

                <button type="submit">ثبت عضو</button>
            </form>

            <p id="formMessage" role="status"></p>
        </section>

        <section class="panel">
            <div class="list-header">
                <h2>اعضای ثبت‌شده</h2>
                <button id="refreshButton" type="button">به‌روزرسانی</button>
                <button id="syncButton" type="button">همگام‌سازی همهٔ حساب‌ها</button>
            </div>

            <label for="searchMember">جستجوی عضو</label>
            <input id="searchMember" type="search"
                   placeholder="نام، شماره تلفن یا کد ملی..." autocomplete="off">

            <p id="syncMessage" role="status"></p>
            <div id="membersList">در حال دریافت اعضا...</div>

            <section id="editPanel" class="panel" hidden>
                <h2>ویرایش عضو</h2>

                <form id="editMemberForm">
                    <input id="editMemberId" type="hidden">

                    <label for="editFullName">نام و نام خانوادگی</label>
                    <input id="editFullName" type="text" required>

                    <label for="editPhone">شماره تلفن</label>
                    <input id="editPhone" type="tel" inputmode="numeric" required>

                    <label for="editNationalId">کد ملی (رمز ورود عضو)</label>
                    <input id="editNationalId" type="text" inputmode="numeric"
                           maxlength="10" pattern="[0-9]{10}" required>

                    <label for="editRing">حلقه</label>
                    <select id="editRing" required>
                        <option value="ring1">حلقه اول</option>
                        <option value="ring2">حلقه دوم</option>
                        <option value="ring3">حلقه سوم</option>
                        <option value="ring4">حلقه چهارم</option>
                        <option value="ring5">حلقه پنجم</option>
                    </select>

                    <label for="editStatus">وضعیت عضویت</label>
                    <select id="editStatus">
                        <option value="active">فعال</option>
                        <option value="inactive">غیرفعال (امکان ورود ندارد)</option>
                    </select>

                    <button type="submit">ذخیره تغییرات</button>
                    <button id="cancelEdit" type="button">انصراف</button>
                </form>

                <p id="editMessage" role="status"></p>
            </section>
        </section>

    </main>

    <script src="https://cdn.jsdelivr.net/npm/appwrite@21.4.0"></script>
    <script src="config.js"></script>
    <script src="admin-auth.js"></script>
    <script src="admin.js"></script>
</body>
</html>
