
<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta name="theme-color" content="#0b0d12">
    <meta name="description" content="ورود به پیام‌رسان حلقات صالحین">

    <title>ورود | پیام‌رسان حلقات صالحین</title>

    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="responsive.css">
    <link rel="stylesheet" href="auth.css">

    
</head>

<body class="auth-page">

    <main class="auth-card">

        <div class="auth-logo" aria-hidden="true">ح</div>

        <h1>خوش آمدی 🌱</h1>

        <p class="auth-description">
            برای ورود به پیام‌رسان حلقات صالحین،
            شماره، کد ملی و ایمیلت را وارد کن؛ کد ورود به ایمیلت ارسال می‌شود. (دفعهٔ اول، همین ایمیل روی حسابت ثبت می‌شود.)
        </p>

        <form id="loginForm">
            <label for="phone">شماره تلفن</label>
            <input type="tel" id="phone" name="phone" inputmode="numeric"
                   placeholder="09123456789" autocomplete="tel" required>

            <label for="nationalId">کد ملی</label>
            <input type="password" id="nationalId" name="nationalId" inputmode="numeric"
                   maxlength="10" placeholder="کد ملی ۱۰ رقمی" autocomplete="off" required>

            <label for="loginEmail">ایمیل</label>
            <input type="email" id="loginEmail" name="email" dir="ltr"
                   placeholder="name@gmail.com" autocomplete="email" required>

            <button type="submit" class="auth-submit">دریافت کد ورود</button>
        </form>

        <form id="codeForm" hidden>
            <p class="auth-description" id="codeHint"></p>

            <label for="otpCode">کد ورود</label>
            <input type="text" id="otpCode" name="otpCode" inputmode="numeric"
                   maxlength="6" placeholder="کد ۶ رقمی" autocomplete="one-time-code" required>

            <button type="submit" class="auth-submit">ورود به پیام‌رسان</button>
            <button type="button" id="backToLogin" class="auth-submit"
                    style="background:transparent;border:1px solid #343b49;margin-top:8px">
                بازگشت
            </button>
        </form>

        <p id="formMessage" class="form-message" role="status"></p>

        <div class="auth-footer">
            <span>اکانت نداری؟</span>
            <p>حساب‌ها توسط مدیر ساخته می‌شود؛ با مسئول حلقه تماس بگیر.</p>
        </div>

    </main>

    <script src="https://cdn.jsdelivr.net/npm/appwrite@21.4.0"></script>
    <script src="config.js"></script>
    <script src="login.js"></script>

</body>
</html>
