@font-face {
    font-family: "Vazirmatn";

:root {
    --green: #176b45;

* {

}

html {

}

body {

/* سربرگ */

.messenger-header {
    min-height: 82px;

    align-items: center;
    justify-content: space-between;
    gap: 12px;
    background: #fff;
    border-bottom: 1px solid var(--border);
}

.messenger-brand {
    display: flex;
    align-items: center;
    gap: 12px;
}

.brand-icon {
    width: 52px;
    height: 52px;
    display: grid;
    place-items: center;
    flex-shrink: 0;
    border-radius: 17px;
    color: white;
    background: linear-gradient(145deg, #27885b, #125437);

}

.brand-copy {

    flex-direction: column;
}

.brand-copy strong {

.brand-copy small {

/* صفحه اصلی */

.messenger-main {

/* سه تب در یک ردیف */

.messenger-tabs {
    display: grid !important;

.messenger-tab {
    display: flex !important;

.messenger-tab.active {

.messenger-tab:active {

/* محتوای تب‌ها */

"use strict";

// تنظیمات اتصال به Appwrite
const APPWRITE_ENDPOINT = "https://cloud.appwrite.io/v1";
const APPWRITE_PROJECT_ID = "6ad8c664000392442826";
const APPWRITE_DATABASE_ID = "6ad8cb9d003bd982b313";

// جدول اعضا (همان جدول قبلی)
const APPWRITE_TABLE_ID = "fani_data";

// پیام‌ها هم در همین جدول ذخیره می‌شوند (نسخهٔ رایگان فقط یک جدول دارد)
const APPWRITE_MESSAGES_TABLE_ID = APPWRITE_TABLE_ID;

// فضای ذخیرهٔ عکس و ویدیو (Storage)
const APPWRITE_BUCKET_ID = "media";

// شناسهٔ حساب مدیر
const ADMIN_USER_ID = "6adb4b2600227975bf32";

// شناسهٔ تابع Appwrite (بعد از ساخت تابع، همین‌جا بنویس)
const FUNCTION_ID = "fani-admin";

// نام حلقه‌ها
const RING_NAMES = {
    ring1: "حلقه اول",
    ring2: "حلقه دوم",
    ring3: "حلقه سوم",
    ring4: "حلقه چهارم",
    ring5: "حلقه پنجم"
};

// ساخت اتصال مشترک
const appwriteClient = new Appwrite.Client()
    .setEndpoint(APPWRITE_ENDPOINT)
    .setProject(APPWRITE_PROJECT_ID);

// سرویس حساب کاربری
const appwriteAccount = new Appwrite.Account(appwriteClient);

// سرویس جدول‌ها
const appwriteTablesDB = new Appwrite.TablesDB(appwriteClient);

// سرویس فایل‌ها
const appwriteStorage = new Appwrite.Storage(appwriteClient);

// سرویس توابع
const appwriteFunctions = new Appwrite.Functions(appwriteClient);

// اجرای تابع سمت سرور؛ هویت کاربر را خود Appwrite تأیید می‌کند
async function callServer(payload) {
    const execution = await appwriteFunctions.createExecution({
        functionId: FUNCTION_ID,
        body: JSON.stringify(payload),
        async: false,
        method: "POST",
        headers: { "content-type": "application/json" }
    });

    let data = {};
    try { data = JSON.parse(execution.responseBody || "{}"); } catch (_) {}

    if (execution.status === "failed" || !data.success) {
        throw new Error(data.error || "درخواست ناموفق بود.");
    }
    return data;
}

    <script>
"use strict";

document.addEventListener("DOMContentLoaded", async () => {
    const loginForm = document.getElementById("loginForm");
    const message = document.getElementById("formMessage");

    function normalizeDigits(value = "") {
        return value
            .replace(/[۰-۹]/g, d => "۰۱۲۳۴۵۶۷۸۹".indexOf(d))
            .replace(/[٠-٩]/g, d => "٠١٢٣٤٥٦٧٨٩".indexOf(d));
    }

    function say(text, color) {
        message.textContent = text;
        message.style.color = color || "#f8fafc";
    }

    function saveLocalUser(account, phone) {
        localStorage.setItem("memoryUser", JSON.stringify({
            name: account.name || "",
            phone: phone || (account.prefs && account.prefs.phone) || "",
            email: ""
        }));
        localStorage.setItem("loggedIn", "true");
    }

    // اگر قبلاً وارد شده، مستقیم برو صفحهٔ اصلی
    try {
        const current = await appwriteAccount.get();
        if (current.$id !== ADMIN_USER_ID) {
            saveLocalUser(current);
            window.location.replace("index.html");
            return;
        }
    } catch (_) { /* نشست فعالی نیست */ }

    loginForm.addEventListener("submit", async event => {
        event.preventDefault();

        const phone = normalizeDigits(document.getElementById("phone").value.trim());
        const nationalId = normalizeDigits(document.getElementById("nationalId").value.trim());

        if (!/^09\d{9}$/.test(phone) || !/^\d{10}$/.test(nationalId)) {
            say("شماره موبایل یا کد ملی معتبر نیست.", "#ef4444");
            return;
        }

        const button = loginForm.querySelector('button[type="submit"]');
        button.disabled = true;
        say("در حال ورود...", "#f59e0b");

        try {
            try { await appwriteAccount.deleteSession({ sessionId: "current" }); } catch (_) {}

            await appwriteAccount.createEmailPasswordSession({
                email: phone + "@fani.com",
                password: nationalId
            });

            const account = await appwriteAccount.get();
            saveLocalUser(account, phone);

            say("ورود موفق بود.", "#22c55e");
            window.location.replace("index.html");
        } catch (error) {
            console.error("Login error:", error && error.code, error && error.type);

            if (error && error.type === "user_blocked") {
                say("حساب شما غیرفعال است؛ با مسئول حلقه تماس بگیر.", "#ef4444");
            } else if (error && error.code === 429) {
                say("تلاش‌های زیاد؛ چند دقیقه بعد دوباره امتحان کن.", "#ef4444");
            } else if (error && error.code === 401) {
                say("شماره موبایل یا کد ملی اشتباه است.", "#ef4444");
            } else {
                say("ورود ناموفق بود؛ اتصال اینترنت را بررسی کن.", "#ef4444");
            }
            button.disabled = false;
        }
    });
